<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana Esquadrias — Controle de Entregas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --brand-navy:#001f2d;
  --font-head:'Space Grotesk', system-ui, sans-serif;
  --font-body:'Inter', system-ui, sans-serif;

  --bg:#020c12;
  --bg-soft:#04141c;
  --panel:#071b26;
  --panel-2:#0a2331;
  --panel-3:#0d2c3d;
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.14);
  --text:#e4eef3;
  --text-dim:#87a6b7;
  --text-faint:#4d7387;
  --accent:#4fa2cb;
  --accent-strong:#7fc2e2;
  --accent-ink:#03151e;
  --shadow:0 12px 32px -12px rgba(0,0,0,.65);

  --st-transit:#4a90c4;
  --st-transit-bg:rgba(74,144,196,.16);
  --st-partial:#e3a73b;
  --st-partial-bg:rgba(227,167,59,.16);
  --st-done:#3fae72;
  --st-done-bg:rgba(63,174,114,.16);
  --st-late:#e0666c;
  --st-late-bg:rgba(224,102,108,.18);

  --radius-s:3px;
  --radius-m:4px;
  --radius-l:5px;
  --sidebar-w:264px;
  --sidebar-w-collapsed:76px;
}

:root[data-theme="light"]{
  --bg:#eef3f6;
  --bg-soft:#e3ecf1;
  --panel:#ffffff;
  --panel-2:#f4f8fa;
  --panel-3:#e9f0f4;
  --border:rgba(0,47,67,.11);
  --border-strong:rgba(0,47,67,.22);
  --text:#0a2a3b;
  --text-dim:#4d6c7c;
  --text-faint:#7d97a4;
  --accent:#146d93;
  --accent-strong:#0a4d68;
  --accent-ink:#ffffff;
  --shadow:0 12px 28px -14px rgba(4,40,58,.25);

  --st-transit:#1f6fa3;
  --st-transit-bg:rgba(31,111,163,.10);
  --st-partial:#b8791a;
  --st-partial-bg:rgba(184,121,26,.12);
  --st-done:#217a4f;
  --st-done-bg:rgba(33,122,79,.11);
  --st-late:#c53f47;
  --st-late-bg:rgba(197,63,71,.11);
}

@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3f6; --bg-soft:#e3ecf1; --panel:#ffffff; --panel-2:#f4f8fa; --panel-3:#e9f0f4;
    --border:rgba(0,47,67,.11); --border-strong:rgba(0,47,67,.22);
    --text:#0a2a3b; --text-dim:#4d6c7c; --text-faint:#7d97a4;
    --accent:#146d93; --accent-strong:#0a4d68; --accent-ink:#ffffff;
    --st-transit:#1f6fa3; --st-transit-bg:rgba(31,111,163,.10);
    --st-partial:#b8791a; --st-partial-bg:rgba(184,121,26,.12);
    --st-done:#217a4f; --st-done-bg:rgba(33,122,79,.11);
    --st-late:#c53f47; --st-late-bg:rgba(197,63,71,.11);
  }
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
svg{display:inline-block; width:1em; height:1em; vertical-align:-0.15em; flex:0 0 auto;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-head); margin:0; letter-spacing:.01em;}
p{margin:0;}
button{font-family:inherit;}
::selection{background:var(--accent); color:var(--accent-ink);}

/* scrollbars */
*{scrollbar-width:thin; scrollbar-color:var(--panel-3) transparent;}
*::-webkit-scrollbar{width:9px; height:9px;}
*::-webkit-scrollbar-thumb{background:var(--panel-3); border-radius:8px;}

/* ============ BOOT ============ */
.boot-screen{
  height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; background:var(--brand-navy); color:#fff;
}
.boot-mark{font-family:var(--font-head); font-size:42px; font-weight:700; letter-spacing:.14em;}
.boot-label{font-size:13px; color:#9fc2d6; letter-spacing:.02em;}

/* ============ SHELL ============ */
#app{min-height:100vh; display:flex;}
.shell{display:flex; width:100%; min-height:100vh;}

/* ---- Sidebar ---- */
.sidebar{
  width:var(--sidebar-w);
  flex:0 0 auto;
  background:var(--brand-navy);
  color:#eaf3f7;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  transition:width .2s ease;
  z-index:40;
  border-right:1px solid rgba(255,255,255,.06);
}
.sidebar.collapsed{width:var(--sidebar-w-collapsed);}

.sidebar-logo{
  display:flex; align-items:center; gap:10px;
  padding:18px 16px; border-bottom:1px solid rgba(255,255,255,.08);
  min-height:64px;
}
.sidebar-logo img{height:26px; display:block;}
.sidebar-logo .icon-logo{height:34px; width:34px; border-radius:8px; display:block; object-fit:cover;}
.sidebar-logo-text{display:flex; flex-direction:column; line-height:1.15; overflow:hidden;}
.sidebar-logo-text b{font-family:var(--font-head); font-size:15px; letter-spacing:.08em;}
.sidebar-logo-text span{font-size:9.5px; color:#8fb4c8; letter-spacing:.06em; white-space:nowrap;}
.sidebar.collapsed .sidebar-logo-text{display:none;}
.sidebar.collapsed .sidebar-logo{justify-content:center;}

.sidebar-nav{flex:1; overflow-y:auto; padding:14px 10px; display:flex; flex-direction:column; gap:3px;}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px; border-radius:var(--radius-m);
  color:#c3dae5; text-decoration:none; cursor:pointer;
  font-size:13.5px; font-weight:500; border:none; background:transparent; width:100%; text-align:left;
  white-space:nowrap; overflow:hidden;
  position:relative;
}
.nav-item svg{flex:0 0 auto; width:18px; height:18px; opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(92,178,217,.16); color:#8fd0e8;}
.nav-item.active svg{opacity:1;}
.nav-item .nav-badge{
  margin-left:auto; background:var(--st-late); color:#fff; font-size:10.5px; font-weight:700;
  border-radius:20px; padding:1px 6px; min-width:17px; text-align:center;
}
.sidebar.collapsed .nav-item{justify-content:center; padding:11px 0;}
.sidebar.collapsed .nav-item span.nav-label{display:none;}
.sidebar.collapsed .nav-item .nav-badge{position:absolute; top:4px; right:10px; margin-left:0;}

.nav-section-label{
  font-size:10px; text-transform:uppercase; letter-spacing:.11em; color:#5f8299;
  padding:14px 12px 4px;
}
.sidebar.collapsed .nav-section-label{display:none;}

.sidebar-foot{padding:12px 10px 16px; border-top:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:8px;}
.sidebar-toggle{
  display:flex; align-items:center; gap:10px; justify-content:center;
  padding:9px; border-radius:var(--radius-m); border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.03); color:#c3dae5; cursor:pointer; font-size:12px;
}
.sidebar-toggle:hover{background:rgba(255,255,255,.08);}
.theme-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 4px;}
.sidebar.collapsed .theme-row{flex-direction:column;}
.theme-row-label{font-size:11.5px; color:#9fc2d6;}
.sidebar.collapsed .theme-row-label{display:none;}
.sync-pill{
  display:flex; align-items:center; gap:6px; font-size:10.5px; color:#8fb4c8; padding:0 4px;
}
.sync-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--st-done); flex:0 0 auto;}
.sync-pill.offline .dot{background:var(--st-partial);}
.sidebar.collapsed .sync-pill span.txt{display:none;}

.theme-switch{
  position:relative; width:40px; height:22px; border-radius:20px; border:none; cursor:pointer;
  background:rgba(255,255,255,.15); flex:0 0 auto;
}
.theme-switch::after{
  content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:#fff; transition:left .18s ease;
}
:root[data-theme="light"] .theme-switch::after{left:20px;}
:root[data-theme="light"] .theme-switch{background:rgba(255,255,255,.35);}

/* ---- Main ---- */
.main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:16px 26px; background:var(--bg); border-bottom:1px solid var(--border);
}
.topbar-title{display:flex; flex-direction:column; gap:2px; margin-right:auto;}
.topbar-title h1{font-size:20px; font-weight:600;}
.topbar-title .sub{font-size:12.5px; color:var(--text-dim);}
.hamburger{
  display:none; width:36px; height:36px; border-radius:var(--radius-m); border:1px solid var(--border-strong);
  background:var(--panel); color:var(--text); align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
}

.weeknav{display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-m); padding:4px;}
.weeknav button{
  width:30px; height:30px; border-radius:var(--radius-s); border:none; background:transparent; color:var(--text);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.weeknav button:hover{background:var(--panel-3);}
.weeknav .weeknav-label{font-size:12.5px; font-weight:600; padding:0 8px; white-space:nowrap;}
.weeknav .today-btn{
  font-size:11.5px; font-weight:600; padding:0 10px; border-radius:var(--radius-s); color:var(--accent);
}
.weeknav{position:relative;}
.weeknav-cal-wrap{position:relative; width:30px; height:30px; flex:0 0 auto;}
.weeknav-cal-icon{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--text); pointer-events:none; border-radius:var(--radius-s);
}
.weeknav-cal-wrap:hover .weeknav-cal-icon{background:var(--panel-3);}
.weeknav-datepicker-overlay{
  position:absolute; inset:0; width:100%; height:100%; opacity:0; border:none; padding:0; margin:0;
  cursor:pointer; color-scheme:dark;
}
:root[data-theme="light"] .weeknav-datepicker-overlay{color-scheme:light;}

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:var(--radius-m);
  border:1px solid var(--border-strong); background:var(--panel); color:var(--text); font-size:13px; font-weight:600;
  cursor:pointer; white-space:nowrap; transition:background .12s ease, transform .05s ease;
}
.btn:hover{background:var(--panel-3);}
.btn:active{transform:scale(.98);}
.btn svg{width:15px; height:15px;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--panel-2);}
.btn-danger{color:var(--st-late);}
.btn-sm{padding:6px 11px; font-size:12px;}

.content{padding:22px 26px 60px; flex:1;}

/* ============ DASHBOARD ============ */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px;}
.kpi-card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 14px;
  display:flex; flex-direction:column; gap:2px; box-shadow:var(--shadow);
}
.kpi-card .kpi-top{display:flex; align-items:center; justify-content:space-between;}
.kpi-card .kpi-label{font-size:11px; color:var(--text-dim); font-weight:600; letter-spacing:.02em;}
.kpi-card .kpi-value{font-family:var(--font-head); font-size:22px; font-weight:700;}
.kpi-card.alert .kpi-value{color:var(--st-late);}
.kpi-icon{width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.kpi-icon svg{width:12px; height:12px;}

.dash-cols{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:900px){.dash-cols{grid-template-columns:1fr;}}
.panel-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px; box-shadow:var(--shadow);}
.panel-card h3{font-size:13px; margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.panel-card h3 svg{width:14px; height:14px;}
.mini-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px;}
.mini-row:last-child{border-bottom:none;}
.mini-row .mr-main{flex:1; min-width:0;}
.mini-row .mr-main b{display:block; font-size:12.8px;}
.mini-row .mr-main small{color:var(--text-dim); font-size:11px;}
.empty-hint{color:var(--text-faint); font-size:12px; padding:6px 2px;}

.tip-card{
  border:1px dashed var(--border-strong); border-radius:var(--radius-m); padding:11px 14px; margin-top:12px;
  background:var(--panel-2); font-size:12px; color:var(--text-dim); line-height:1.5;
}
.tip-card svg{width:13px; height:13px;}
.tip-card b{color:var(--text);}

/* ============ CALENDAR ============ */
.cal-wrap{overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch;}
.cal-grid{display:grid; grid-template-columns:repeat(6,minmax(200px,1fr)); gap:12px; min-width:900px;}
@media(max-width:640px){.cal-grid{grid-auto-flow:column; grid-template-columns:none; grid-auto-columns:82vw;}}

.cal-day{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-l); display:flex; flex-direction:column; overflow:hidden;}
.cal-day.is-today{border-color:var(--accent);}
.cal-day-head{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; justify-content:space-between;}
.cal-day-head .dow{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim);}
.cal-day.is-today .cal-day-head .dow{color:var(--accent);}
.cal-day-head .dnum{font-family:var(--font-head); font-size:15px; font-weight:600;}
.cal-period{padding:10px 12px 14px;}
.cal-period-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:700; margin:6px 2px 8px;}
.cal-period-window{text-transform:none; letter-spacing:0; font-weight:600; opacity:.85;}
.dc-window{font-size:10.5px; font-weight:600; color:var(--accent); text-transform:none; letter-spacing:0;}
.cal-period:first-child .cal-period-label{margin-top:0;}

.dcard{
  background:var(--panel-2); border:1px solid var(--border); border-left:4px solid var(--st-transit);
  border-radius:var(--radius-s); padding:9px 10px; margin-bottom:7px; cursor:pointer; transition:transform .08s ease, box-shadow .08s ease;
}
.dcard:hover{box-shadow:var(--shadow); transform:translateY(-1px);}
.dcard.st-a_caminho{background:var(--st-transit-bg); border-color:var(--st-transit); border-left-color:var(--st-transit);}
.dcard.st-entregue_parcial{background:var(--st-partial-bg); border-color:var(--st-partial); border-left-color:var(--st-partial);}
.dcard.st-entregue{background:var(--st-done-bg); border-color:var(--st-done); border-left-color:var(--st-done);}
.dcard.st-atrasado{background:var(--st-late-bg); border-color:var(--st-late); border-left-color:var(--st-late);}
.dcard .dc-forn{font-size:13px; font-weight:700; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dcard .dc-obra{font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dcard .dc-foot{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
.dcard .dc-po{font-size:10.5px; color:var(--text-faint); font-family:var(--font-body);}
.dcard .dc-meta{font-size:10.5px; color:var(--text-faint);}

.status-chip{
  font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.02em; white-space:nowrap;
}
.status-chip.st-a_caminho{background:var(--st-transit-bg); color:var(--st-transit);}
.status-chip.st-entregue_parcial{background:var(--st-partial-bg); color:var(--st-partial);}
.status-chip.st-entregue{background:var(--st-done-bg); color:var(--st-done);}
.status-chip.st-atrasado{background:var(--st-late-bg); color:var(--st-late);}

.add-slot{
  border:1.5px dashed var(--border-strong); border-radius:var(--radius-s); padding:8px; text-align:center;
  font-size:11.5px; color:var(--text-faint); cursor:pointer; margin-bottom:2px;
}
.add-slot:hover{border-color:var(--accent); color:var(--accent);}

/* ============ TOOLBAR / FILTERS ============ */
.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.search-box{
  display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius-m); padding:8px 12px; flex:1; min-width:180px; max-width:320px;
}
.search-box svg{width:15px; height:15px; color:var(--text-faint); flex:0 0 auto;}
.search-box input{border:none; background:transparent; outline:none; color:var(--text); font-size:13px; width:100%;}
.seg-tabs{display:flex; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-m); padding:3px; gap:2px;}
.seg-tabs button{
  border:none; background:transparent; padding:7px 14px; border-radius:calc(var(--radius-m) - 3px); font-size:12.5px;
  font-weight:600; color:var(--text-dim); cursor:pointer;
}
.seg-tabs button.active{background:var(--accent); color:var(--accent-ink);}
.select-mini{
  border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:var(--radius-m);
  padding:8px 10px; font-size:12.5px; font-weight:500;
}

/* ============ TABLE (Finalizados) ============ */
.table-wrap{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-l); overflow:hidden; box-shadow:var(--shadow);}
table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
.data-table th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);
  padding:12px 16px; border-bottom:1px solid var(--border); background:var(--panel-2); font-weight:700;
}
.data-table td{padding:12px 16px; border-bottom:1px solid var(--border); vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--panel-2);}
.tag-tipo{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--panel-3); color:var(--text-dim);}

/* ============ EMPTY STATES ============ */
.empty-state{
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:60px 20px; color:var(--text-dim); gap:8px;
}
.empty-state svg{width:40px; height:40px; opacity:.35; margin-bottom:6px;}
.empty-state b{color:var(--text); font-size:14.5px;}
.empty-state p{font-size:12.8px; max-width:320px;}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(2,15,22,.6); backdrop-filter:blur(2px);
  display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto;
}
.modal{
  background:var(--panel); border:1px solid var(--border-strong); border-radius:var(--radius-l);
  width:100%; max-width:520px; box-shadow:0 30px 70px -20px rgba(0,0,0,.5); animation:modalIn .16s ease;
}
@keyframes modalIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-close{width:30px; height:30px; border-radius:50%; border:none; background:var(--panel-2); color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.modal-body{padding:20px 22px; display:flex; flex-direction:column; gap:14px; max-height:64vh; overflow-y:auto;}
.modal-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}

.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12px; font-weight:600; color:var(--text-dim);}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=url],.field select,.field textarea{
  border:1px solid var(--border-strong); background:var(--panel-2); color:var(--text); border-radius:var(--radius-m);
  padding:10px 12px; font-size:13.5px; font-family:inherit; outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.radio-row{display:flex; gap:8px;}
.radio-pill{
  flex:1; text-align:center; padding:9px; border-radius:var(--radius-m); border:1px solid var(--border-strong);
  font-size:12.8px; font-weight:600; cursor:pointer; color:var(--text-dim); background:var(--panel-2);
}
.radio-pill.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.status-pick{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.status-opt{
  border-radius:var(--radius-m); padding:9px 10px; border:1.5px solid var(--border-strong); cursor:pointer;
  font-size:12.5px; font-weight:700; text-align:center; background:var(--panel-2); color:var(--text-dim);
}
.status-opt.active.st-a_caminho{background:var(--st-transit-bg); border-color:var(--st-transit); color:var(--st-transit);}
.status-opt.active.st-entregue_parcial{background:var(--st-partial-bg); border-color:var(--st-partial); color:var(--st-partial);}
.status-opt.active.st-entregue{background:var(--st-done-bg); border-color:var(--st-done); color:var(--st-done);}
.autocomplete-wrap{position:relative;}
.dropzone{
  border:1.5px dashed var(--border-strong); border-radius:var(--radius-m); padding:16px 14px; text-align:center;
  background:var(--panel-2); cursor:pointer; transition:border-color .12s ease, background .12s ease;
}
.dropzone.drag-over{border-color:var(--accent); background:var(--st-transit-bg);}
.dropzone .dz-inner{font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap;}
.dropzone .dz-browse{background:none; border:none; color:var(--accent); font-weight:700; text-decoration:underline; cursor:pointer; font-size:12.5px; padding:0;}
.dropzone svg{width:15px; height:15px;}
.anexo-list{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
.anexo-chip{
  display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--border);
  border-radius:var(--radius-s); padding:7px 10px; font-size:12.5px;
}
.anexo-chip a{color:var(--text); text-decoration:none; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
.anexo-chip a:hover{color:var(--accent);}
.anexo-chip .anexo-size{color:var(--text-faint); font-size:11px; flex:0 0 auto;}
.anexo-chip button{width:20px; height:20px; border-radius:50%; border:none; background:var(--panel-3); color:var(--text-dim); cursor:pointer; font-size:11px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
.anexo-chip button:hover{background:var(--st-late); color:#fff;}
.anexo-chip.uploading{opacity:.6;}
.ac-list{
  position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--panel); border:1px solid var(--border-strong);
  border-radius:var(--radius-m); box-shadow:var(--shadow); max-height:160px; overflow-y:auto; z-index:20;
}
.ac-list div{padding:8px 12px; font-size:13px; cursor:pointer;}
.ac-list div:hover{background:var(--panel-3);}

/* ============ CONFIG ============ */
.config-tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
.config-tabs button{
  border:1px solid var(--border); background:var(--panel); color:var(--text-dim); padding:9px 15px; border-radius:var(--radius-m);
  font-size:12.8px; font-weight:600; cursor:pointer;
}
.config-tabs button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.chip{
  display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--border);
  padding:7px 8px 7px 13px; border-radius:20px; font-size:12.8px;
}
.chip button{width:19px; height:19px; border-radius:50%; border:none; background:var(--panel-3); color:var(--text-dim); cursor:pointer; font-size:12px; line-height:1;}
.chip button:hover{background:var(--st-late); color:#fff;}
.add-inline{display:flex; gap:8px; margin-top:14px;}
.add-inline input{flex:1;}
.field-list-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
.field-list-row:last-child{border-bottom:none;}
.field-list-row .flr-name{flex:1; font-size:13px; font-weight:600;}
.field-list-row .flr-type{font-size:11px; color:var(--text-faint); background:var(--panel-2); padding:2px 8px; border-radius:6px;}
.danger-zone{border:1px solid var(--st-late-bg); background:var(--st-late-bg); border-radius:var(--radius-l); padding:16px 18px; margin-top:10px;}
.danger-zone p{font-size:12.5px; color:var(--text-dim); margin-bottom:10px;}

/* ============ FIREWORKS (full delivery celebration) ============ */
.firework-overlay{position:fixed; inset:0; pointer-events:none; z-index:500; overflow:hidden;}
.fw-particle{
  position:absolute; border-radius:50%; opacity:1; will-change:transform,opacity;
  animation-name:fwBurst; animation-timing-function:cubic-bezier(.15,.65,.3,1); animation-fill-mode:forwards;
  box-shadow:0 0 6px 1px currentColor;
}
@keyframes fwBurst{
  0%{ transform:translate(0,0) scale(1); opacity:1; }
  70%{ opacity:1; }
  100%{ transform:translate(var(--dx), calc(var(--dy) + 40px)) scale(.3); opacity:0; }
}
.fw-flash{
  position:absolute; width:18px; height:18px; border-radius:50%; background:#fff;
  transform:translate(-50%,-50%); animation:fwFlash .35s ease-out forwards;
}
@keyframes fwFlash{ from{opacity:.9; transform:translate(-50%,-50%) scale(0.4);} to{opacity:0; transform:translate(-50%,-50%) scale(3);} }
.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
.toast{
  background:var(--panel); border:1px solid var(--border-strong); color:var(--text); padding:11px 16px; border-radius:var(--radius-m);
  font-size:12.8px; box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; animation:toastIn .15s ease;
  max-width:320px;
}
@keyframes toastIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.toast .tdot{width:8px; height:8px; border-radius:50%; background:var(--st-done); flex:0 0 auto;}
.toast.warn .tdot{background:var(--st-partial);}

/* ============ MOBILE ============ */
.sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:35;}
@media(max-width:900px){
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .2s ease; width:264px !important;}
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.mobile-open ~ .sidebar-scrim{display:block;}
  .hamburger{display:flex;}
  .content{padding:18px 16px 50px;}
  .topbar{padding:14px 16px;}
  .field-row{grid-template-columns:1fr;}
}
@media(max-width:520px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .kpi-card .kpi-value{font-size:24px;}
}

/* ============ PRINT ============ */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:0; background:#fff; color:#0a2a3b;}
  .p-header{display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #002f43; padding-bottom:10px; margin-bottom:16px;}
  .p-header h1{font-size:18px; color:#002f43; font-family:Arial, sans-serif;}
  .p-header .p-sub{font-size:11px; color:#555;}
  .p-day{margin-bottom:14px; break-inside:avoid;}
  .p-day h2{font-size:13px; background:#002f43; color:#fff; padding:5px 10px; border-radius:4px; margin-bottom:6px; font-family:Arial, sans-serif;}
  .p-period{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#666; margin:6px 0 3px; font-weight:700;}
  table.p-table{width:100%; border-collapse:collapse; margin-bottom:4px;}
  table.p-table th{text-align:left; font-size:10px; text-transform:uppercase; color:#555; border-bottom:1px solid #999; padding:4px 6px;}
  table.p-table td{font-size:11.5px; padding:5px 6px; border-bottom:1px solid #ddd;}
  .p-empty{font-size:11px; color:#888; padding:4px 6px; font-style:italic;}
  .p-foot{margin-top:16px; font-size:9.5px; color:#888; text-align:right;}
}

</style>
</head>

function pad(n){return String(n).padStart(2,'0');}
function toKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromKey(k){const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d);}
function startOfWeek(d){ // Monday-based
  const dt = new Date(d); const wd = dt.getDay(); const diff = (wd===0?-6:1)-wd;
  dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt;
}
function addDays(d,n){const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt;}
function isSameDay(a,b){return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();}

  if(item.status === 'entregue') return 'entregue';
  if(item.status === 'entregue_parcial') return 'entregue_parcial';
  // a_caminho: check date
  if(item.data && item.data < todayKey()) return 'atrasado';
  return 'a_caminho';
}
const STATUS_LABEL = {a_caminho:'A caminho', entregue_parcial:'Entregue parcial', entregue:'Entregue', atrasado:'Atrasado'};
const PERIODO_LABEL = {manha:'Manhã', tarde:'Tarde'};

function fmtHM(t){
  if(!t) return '';
  const parts = String(t).split(':');
  const h = parts[0], m = parts[1];
  return (!m || m==='00') ? `${h}h` : `${h}h${m}`;
}
function defaultWindowLabel(periodo){
  const w = (S.config.janelas||{})[periodo];
  if(!w || (!w.inicio && !w.fim)) return '';
  return `${fmtHM(w.inicio)}–${fmtHM(w.fim)}`;
}
function itemWindowLabel(item){
  if(item && (item.janelaInicio || item.janelaFim)) return `${fmtHM(item.janelaInicio)}–${fmtHM(item.janelaFim)}`;
  return '';
}
function effectiveWindowLabel(item){
  return itemWindowLabel(item) || defaultWindowLabel(item && item.periodo);
}

function allEntregas(){return Object.values(S.entregas);}
function allColetas(){return Object.values(S.coletas);}
function activeEntregas(){return allEntregas().filter(e=>e.status!=='entregue');}
function activeColetas(){return allColetas().filter(e=>e.status!=='entregue');}
function finalEntregas(){return allEntregas().filter(e=>e.status==='entregue');}
function finalColetas(){return allColetas().filter(e=>e.status==='entregue');}

function weekDays(anchor){const arr=[]; for(let i=0;i<6;i++) arr.push(addDays(anchor,i)); return arr;} // Mon-Sat

window.ANA_STATE = S; // debug convenience only

/* ---------------- TOASTS ---------------- */
function toast(msg, warn){
  let wrap = document.getElementById('toastWrap');
  if(!wrap){ wrap=document.createElement('div'); wrap.id='toastWrap'; wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  const el = document.createElement('div');
  el.className = 'toast'+(warn?' warn':'');
  el.innerHTML = '<span class="tdot"></span><span>'+esc(msg)+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, 3200);
}

/* ---------------- DB INIT ---------------- */
async function initDb(){
  let db = null;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      db = await window.claude.use('db');
    }
  }catch(e){ db = null; }

  if(!db){
    S.offline = true;
    if(!loadFallback()) seedDemoData();
    finishBoot();
    return;
  }

  S.db = db;
  S.dbReady = true;

  unsub.entregas = db.collection('entregas').onSnapshot(
    snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]=Object.assign({id:d.id}, d.data()); }); S.entregas=o; render(); },
    err=>{ console.error('entregas snapshot', err); }
  );
  unsub.coletas = db.collection('coletas').onSnapshot(
    snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]=Object.assign({id:d.id}, d.data()); }); S.coletas=o; render(); },
    err=>{ console.error('coletas snapshot', err); }
  );
  unsub.config = db.doc('config/geral').onSnapshot(
    snap=>{
      if(snap.exists){ S.config = Object.assign({}, DEFAULT_CONFIG, snap.data()); }
      render();
    },
    err=>{ console.error('config snapshot', err); }
  );

  // seed once if totally empty (first run for this artifact)
  setTimeout(async ()=>{
    try{
      const cfgSnap = await db.doc('config/geral').get();
      const eSnap = await db.collection('entregas').limit(1).get();
      if(!cfgSnap.exists && eSnap.empty){
        await seedRemoteDemo(db);
      }
    }catch(e){ /* ignore, non-critical */ }
  }, 600);

  finishBoot();
}

/* ---------------- WRITERS (route through db when available, else fallback) ---------------- */
async function saveEntrega(data, id){
  if(S.dbReady){
    try{
      if(id){ await S.db.collection('entregas').doc(id).update(data); }
      else{ data.criadoEm = Date.now(); await S.db.collection('entregas').add(data); }
    }catch(e){ toast('Não foi possível salvar. Tente novamente.', true); console.error(e); return false; }
  } else {
    const key = id || uid();
    S.entregas[key] = Object.assign({id:key}, S.entregas[key]||{}, data, id?{}:{criadoEm:Date.now()});
    saveFallback(); render();
  }
  return true;
}
async function saveColeta(data, id){
  if(S.dbReady){
    try{
      if(id){ await S.db.collection('coletas').doc(id).update(data); }
      else{ data.criadoEm = Date.now(); await S.db.collection('coletas').add(data); }
    }catch(e){ toast('Não foi possível salvar. Tente novamente.', true); console.error(e); return false; }
  } else {
    const key = id || uid();
    S.coletas[key] = Object.assign({id:key}, S.coletas[key]||{}, data, id?{}:{criadoEm:Date.now()});
    saveFallback(); render();
  }
  return true;
}
async function setStatus(kind, id, status){
  const store = kind==='entrega' ? S.entregas : S.coletas;
  const cur = store[id];
  const patch = {status};
  if(status==='entregue'){ patch.finalizadoEm = Date.now(); patch.statusAnterior = (cur&&cur.status!=='entregue') ? cur.status : (cur&&cur.statusAnterior) || 'a_caminho'; }
  if(kind==='entrega') await saveEntrega(patch, id); else await saveColeta(patch, id);
}
async function reopen(kind, id){
  const store = kind==='entrega' ? S.entregas : S.coletas;
  const cur = store[id];
  const back = (cur && cur.statusAnterior) || 'entregue_parcial';
  const patch = {status:back, finalizadoEm:null};
  if(kind==='entrega') await saveEntrega(patch, id); else await saveColeta(patch, id);
}
async function deleteItem(kind, id){
  if(S.dbReady){
    try{ await S.db.collection(kind==='entrega'?'entregas':'coletas').doc(id).delete(); }
    catch(e){ toast('Não foi possível excluir.', true); return; }
  } else {
    if(kind==='entrega') delete S.entregas[id]; else delete S.coletas[id];
    saveFallback(); render();
  }
  toast('Registro excluído.');
}
async function saveConfig(patch){
  const next = Object.assign({}, S.config, patch);
  if(S.dbReady){
    try{ await S.db.doc('config/geral').set(next); }
    catch(e){ toast('Não foi possível salvar configuração.', true); return; }
  } else {
    S.config = next; saveFallback(); render();
  }
}

/* ---------------- TOPBAR ---------------- */
function weekLabel(anchor){
  const end = addDays(anchor,5);
  const sameMonth = anchor.getMonth()===end.getMonth();
  if(sameMonth) return `${anchor.getDate()} a ${end.getDate()} de ${MONTHS[anchor.getMonth()]}, ${anchor.getFullYear()}`;
  return `${anchor.getDate()} ${MONTHS[anchor.getMonth()].slice(0,3)} — ${end.getDate()} ${MONTHS[end.getMonth()].slice(0,3)}, ${end.getFullYear()}`;
}

function renderTopbar(){
  const tb = document.getElementById('topbar');
  const titles = {
    inicio:['Início','Visão geral da semana'],
    entregas:['Entregas','Roteiro semanal de recebimento de materiais'],
    coletas:['Coletas','Retiradas de material agendadas com fornecedores'],
    finalizados:['Finalizados','Histórico de entregas e coletas concluídas'],
    config:['Configurações','Fornecedores, obras e campos do sistema'],
  };
  const [title,sub] = titles[S.route];
  let right = '';
  if(S.route==='entregas' || S.route==='coletas'){
    right = `
      <div class="weeknav">
        <button data-act="prevweek" title="Semana anterior">${ICN.chevL}</button>
        <span class="weeknav-label">${weekLabel(S.weekAnchor)}</span>
        <button data-act="nextweek" title="Próxima semana">${ICN.chevR}</button>
        <button class="today-btn" data-act="today">Hoje</button>
        <div class="weeknav-cal-wrap" title="Ir para uma data">
          <span class="weeknav-cal-icon">${ICN.calendar}</span>
          <input type="date" id="weekDatePicker" class="weeknav-datepicker-overlay" value="${toKey(S.weekAnchor)}">
        </div>
      </div>
      <button class="btn" data-act="print">${ICN.print}Imprimir roteiro</button>
      <button class="btn btn-primary" data-act="new">${ICN.plus}${S.route==='entregas'?'Nova entrega':'Nova coleta'}</button>
    `;
  }
  tb.innerHTML = `
    <button class="hamburger" id="hamBtn">${ICN.menu}</button>
    <div class="topbar-title"><h1>${title}</h1><span class="sub">${sub}</span></div>
    ${right}
  `;
  const ham = document.getElementById('hamBtn');
  if(ham) ham.addEventListener('click', toggleMobileSidebar);
  tb.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click', onTopbarAction));
  const dp = document.getElementById('weekDatePicker');
  if(dp) dp.addEventListener('change', e=>{
    if(e.target.value){ S.weekAnchor = startOfWeek(fromKey(e.target.value)); render(); }
  });
}

function onTopbarAction(e){
  const act = e.currentTarget.dataset.act;
  if(act==='prevweek'){ S.weekAnchor = addDays(S.weekAnchor,-7); render(); }
  else if(act==='nextweek'){ S.weekAnchor = addDays(S.weekAnchor,7); render(); }
  else if(act==='today'){ S.weekAnchor = startOfWeek(new Date()); render(); }
  else if(act==='print'){ doPrint(S.route); }
  else if(act==='new'){ openModal(S.route==='entregas'?'entrega':'coleta'); }
}

/* ---------------- ROUTER / RENDER ---------------- */
function render(){
  if(!document.getElementById('content')) return;
  renderNav();
  renderTopbar();
  const c = document.getElementById('content');
  if(S.route==='inicio') c.innerHTML = viewDashboard();
  else if(S.route==='entregas') c.innerHTML = viewCalendar('entrega');
  else if(S.route==='coletas') c.innerHTML = viewCalendar('coleta');
  else if(S.route==='finalizados') c.innerHTML = viewFinalizados();
  else if(S.route==='config') c.innerHTML = viewConfig();
  bindContentEvents();
}

/* ---------------- DASHBOARD ---------------- */
function viewDashboard(){
  const ae = activeEntregas(), ac = activeColetas();
  const atrasE = ae.filter(i=>effectiveStatus(i)==='atrasado');
  const atrasC = ac.filter(i=>effectiveStatus(i)==='atrasado');
  const wk = weekDays(S.weekAnchor).map(d=>toKey(d));
  const entregasSemana = ae.filter(i=>wk.includes(i.data));
  const coletasSemana = ac.filter(i=>wk.includes(i.data));
  const finalizadasMes = allEntregas().concat(allColetas()).filter(i=>{
    if(i.status!=='entregue' || !i.finalizadoEm) return false;
    const d = new Date(i.finalizadoEm), n = new Date();
    return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
  });

  const proximas = ae.filter(i=>i.data>=todayKey()).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,5);

  const kpi = (label,value,icon,alert)=>`
    <div class="kpi-card${alert?' alert':''}">
      <div class="kpi-top"><span class="kpi-label">${label}</span>
        <span class="kpi-icon" style="background:${alert?'var(--st-late-bg)':'var(--panel-2)'}; color:${alert?'var(--st-late)':'var(--accent)'}">${icon}</span>
      </div>
      <div class="kpi-value">${value}</div>
    </div>`;

  const daysSinceBackup = S.config.lastBackupAt ? Math.floor((Date.now()-S.config.lastBackupAt)/86400000) : null;
  const backupDue = daysSinceBackup===null || daysSinceBackup>=7;

  return `
    <div class="kpi-grid">
      ${kpi('Entregas nesta semana', entregasSemana.length, ICN.truck)}
      ${kpi('Coletas nesta semana', coletasSemana.length, ICN.box)}
      ${kpi('Atrasadas agora', atrasE.length+atrasC.length, ICN.clock, (atrasE.length+atrasC.length)>0)}
      ${kpi('Finalizadas no mês', finalizadasMes.length, ICN.check)}
    </div>
    <div class="dash-cols">
      <div class="panel-card">
        <h3>${ICN.truck} Próximas entregas</h3>
        ${proximas.length ? proximas.map(i=>rowMini(i,'entrega')).join('') : `<div class="empty-hint">Nenhuma entrega futura cadastrada.</div>`}
      </div>
      <div class="panel-card">
        <h3 style="color:var(--st-late)">${ICN.clock} Atrasadas — precisam de atenção</h3>
        ${(atrasE.concat(atrasC)).length ? atrasE.concat(atrasC).map(i=>rowMini(i, i.peso!==undefined?'coleta':'entrega')).join('') : `<div class="empty-hint">Nada atrasado no momento. 🎉</div>`}
      </div>
    </div>
    <div class="tip-card"${backupDue?' style="border-color:var(--st-partial); background:var(--st-partial-bg);"':''}>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <span>${backupDue?ICN.archive:ICN.bulb} &nbsp;${backupDue
          ? `<b>Backup ${daysSinceBackup===null?'nunca foi feito':'está atrasado ('+daysSinceBackup+' dias)'}.</b> Baixe uma cópia de segurança em CSV.`
          : `<b>Backup em dia.</b> Última cópia há ${daysSinceBackup} dia${daysSinceBackup===1?'':'s'}.`}</span>
        <button class="btn btn-sm${backupDue?' btn-primary':''}" id="dashBackupBtn">${ICN.archive}Fazer backup agora</button>
      </div>
    </div>
    <div class="tip-card">
      ${ICN.bulb} &nbsp;<b>Ideia:</b> use o botão <b>Configurações</b> para cadastrar sua lista de fornecedores e obras — elas passam a sugerir automaticamente ao criar uma entrega ou coleta, evitando digitar tudo toda vez.
    </div>
  `;
}
function rowMini(i,kind){
  const st = effectiveStatus(i);
  return `<div class="mini-row" data-open="${kind}:${i.id}" style="cursor:pointer">
    <div class="mr-main"><b>${esc(i.fornecedor||'—')}</b><small>${kind==='entrega'?esc(i.obra||''):esc(i.endereco||'')} · ${fmtDateBR(i.data)}</small></div>
    <span class="status-chip st-${st}">${STATUS_LABEL[st]}</span>
  </div>`;

/* ---------------- CALENDAR (entregas / coletas) ---------------- */
function viewCalendar(kind){
  const days = weekDays(S.weekAnchor);
  const todayK = todayKey();
  const items = kind==='entrega' ? activeEntregas() : activeColetas();

  const cols = days.map(d=>{
    const key = toKey(d);
    const dayItems = items.filter(i=>i.data===key);
    const manha = dayItems.filter(i=>i.periodo==='manha');
    const tarde = dayItems.filter(i=>i.periodo==='tarde');
    const isToday = key===todayK;
    return `
      <div class="cal-day${isToday?' is-today':''}">
        <div class="cal-day-head">
          <span class="dow">${DOW_SHORT[d.getDay()]}</span>
          <span class="dnum">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}</span>
        </div>
        <div class="cal-period">
          <div class="cal-period-label">Manhã${defaultWindowLabel('manha')?` <span class="cal-period-window">· ${defaultWindowLabel('manha')}</span>`:''}</div>
          ${manha.map(i=>cardHtml(i,kind)).join('')}
          <div class="add-slot" data-add="${kind}:${key}:manha">+ adicionar</div>
        </div>
        <div class="cal-period">
          <div class="cal-period-label">Tarde${defaultWindowLabel('tarde')?` <span class="cal-period-window">· ${defaultWindowLabel('tarde')}</span>`:''}</div>
          ${tarde.map(i=>cardHtml(i,kind)).join('')}
          <div class="add-slot" data-add="${kind}:${key}:tarde">+ adicionar</div>
        </div>
      </div>`;
  }).join('');

  return `<div class="cal-wrap"><div class="cal-grid">${cols}</div></div>`;
}

function cardHtml(i,kind){
  const st = effectiveStatus(i);
  const customWin = itemWindowLabel(i);
  if(kind==='entrega'){
    const anexoCount = (i.anexos||[]).length;
    return `<div class="dcard st-${st}" data-open="entrega:${i.id}">
      <div class="dc-forn">${esc(i.fornecedor||'Sem fornecedor')}${customWin?` <span class="dc-window">⏰ ${customWin}</span>`:''}</div>
      <div class="dc-obra">${esc(i.obra||'—')}</div>
      <div class="dc-foot"><span class="dc-po">${esc(i.pedidoCompra||'')}${anexoCount?` · ${ICN.link}${anexoCount}`:''}</span><span class="status-chip st-${st}">${STATUS_LABEL[st]}</span></div>
    </div>`;
  }
  return `<div class="dcard st-${st}" data-open="coleta:${i.id}">
    <div class="dc-forn">${esc(i.fornecedor||'Sem fornecedor')}${customWin?` <span class="dc-window">⏰ ${customWin}</span>`:''}</div>
    <div class="dc-obra">${esc(i.endereco||'—')}</div>
    <div class="dc-foot"><span class="dc-meta">${esc(i.peso||'?')}kg · ${esc(i.quantidade||'?')} vol.</span><span class="status-chip st-${st}">${STATUS_LABEL[st]}</span></div>
  </div>`;
}

/* ---------------- FINALIZADOS ---------------- */
function viewFinalizados(){
  const tipo = S.finalFilter; // 'todos' | 'entregas' | 'coletas'
  let list = finalEntregas().map(i=>Object.assign({_tipo:'entrega'},i))
    .concat(finalColetas().map(i=>Object.assign({_tipo:'coleta'},i)));

  if(tipo==='entregas') list = list.filter(i=>i._tipo==='entrega');
  else if(tipo==='coletas') list = list.filter(i=>i._tipo==='coleta');

  const q = S.finalSearch.trim().toLowerCase();
  if(q){
    list = list.filter(i=> (i.fornecedor||'').toLowerCase().includes(q) || (i.obra||'').toLowerCase().includes(q) || (i.pedidoCompra||'').toLowerCase().includes(q) || (i.endereco||'').toLowerCase().includes(q));
  }
  list = list.slice().sort((a,b)=>(b.finalizadoEm||0)-(a.finalizadoEm||0));

  const rows = list.map(i=>{
    const detalhe = i._tipo==='entrega'
      ? `${esc(i.obra||'—')}${i.pedidoCompra?` · PC ${esc(i.pedidoCompra)}`:''}`
      : `${esc(i.endereco||'—')}${i.peso?` · ${esc(i.peso)} kg`:''}`;
    return `<tr>
      <td><span class="tag-tipo">${i._tipo==='entrega'?'Entrega':'Coleta'}</span></td>
      <td><b>${esc(i.fornecedor)}</b></td>
      <td>${detalhe}</td>
      <td>${fmtDateBR(i.data)}</td>
      <td>${i.finalizadoEm?new Date(i.finalizadoEm).toLocaleDateString('pt-BR'):'—'}</td>
      <td style="text-align:right; white-space:nowrap;">
        <button class="btn btn-sm btn-ghost" data-reopen="${i._tipo}:${i.id}">Reabrir</button>
        <button class="btn btn-sm btn-ghost btn-danger" data-del="${i._tipo}:${i.id}">${ICN.trash}</button>
      </td>
    </tr>`;
  }).join('');

  const head = `<tr><th>Tipo</th><th>Fornecedor</th><th>Detalhe</th><th>Data</th><th>Finalizado em</th><th></th></tr>`;
  const totalEntregas = finalEntregas().length, totalColetas = finalColetas().length;

  return `
    <div class="toolbar">
      <div class="seg-tabs">
        <button data-final-tab="todos" class="${tipo==='todos'?'active':''}">Todos (${totalEntregas+totalColetas})</button>
        <button data-final-tab="entregas" class="${tipo==='entregas'?'active':''}">Entregas (${totalEntregas})</button>
        <button data-final-tab="coletas" class="${tipo==='coletas'?'active':''}">Coletas (${totalColetas})</button>
      </div>
      <div class="search-box">${ICN.search}<input id="finalSearch" placeholder="Buscar por fornecedor, obra, pedido…" value="${esc(S.finalSearch)}"></div>
    </div>
    <div class="table-wrap">
      ${list.length ? `<table class="data-table"><thead>${head}</thead><tbody>${rows}</tbody></table>` :
      `<div class="empty-state">${ICN.archive}<b>Nada por aqui ainda</b><p>Itens marcados como "Entregue" aparecem nesta aba automaticamente.</p></div>`}
    </div>
  `;
}

/* ---------------- CUSTOM CONFIRM (native confirm() can be blocked in embedded previews) ---------------- */
function confirmDialog(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const ov = document.createElement('div');
    ov.className = 'modal-overlay'; ov.style.zIndex = '300';
    ov.innerHTML = `
      <div class="modal" style="max-width:380px;">
        <div class="modal-body" style="padding-top:22px; padding-bottom:6px;">
          <p style="font-size:14px; line-height:1.55;">${esc(message)}</p>
        </div>
        <div class="modal-foot" style="justify-content:flex-end;">
          <button class="btn btn-ghost" id="cdCancel">Cancelar</button>
          <button class="btn" id="cdOk" style="background:var(--st-late); border-color:var(--st-late); color:#fff;">${esc(opts.okLabel||'Confirmar')}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    function cleanup(v){ ov.remove(); resolve(v); }
    ov.addEventListener('click', e=>{ if(e.target===ov) cleanup(false); });
    ov.querySelector('#cdCancel').addEventListener('click', ()=>cleanup(false));
    ov.querySelector('#cdOk').addEventListener('click', ()=>cleanup(true));
  });
}

/* ---------------- FIREWORKS (celebration on full delivery) ---------------- */
function fireworksBurst(){
  const palette = ['#ff4d4d','#ff8c2e','#ffcc33','#ff6b6b','#ffd166','#ff9f1c'];
  const ov = document.createElement('div');
  ov.className = 'firework-overlay';
  document.body.appendChild(ov);

  function burstAt(cxPct, cyPct, delay){
    setTimeout(()=>{
      const cx = window.innerWidth * (cxPct/100);
      const cy = window.innerHeight * (cyPct/100);
      const flash = document.createElement('div');
      flash.className = 'fw-flash';
      flash.style.left = cx+'px'; flash.style.top = cy+'px';
      ov.appendChild(flash);
      const n = 26;
      for(let i=0;i<n;i++){
        const p = document.createElement('div');
        p.className = 'fw-particle';
        const angle = (Math.PI*2*i/n) + (Math.random()*0.4-0.2);
        const dist = 70 + Math.random()*130;
        const size = 4 + Math.random()*5;
        const color = palette[Math.floor(Math.random()*palette.length)];
        p.style.left = cx+'px'; p.style.top = cy+'px';
        p.style.width = size+'px'; p.style.height = size+'px';
        p.style.background = color; p.style.color = color;
        p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
        p.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
        p.style.animationDuration = (750+Math.random()*350)+'ms';
        ov.appendChild(p);
      }
    }, delay);
  }

  burstAt(35+Math.random()*10, 32+Math.random()*8, 0);
  burstAt(60+Math.random()*10, 24+Math.random()*10, 180);
  burstAt(48+Math.random()*8, 42+Math.random()*8, 360);

  toast('🎉 Pedido entregue por completo!');
  setTimeout(()=>ov.remove(), 1700);
}


/* ---------------- TRELLO COPY HELPER ---------------- */
async function copyFromTextarea(ta, btn){
  let done = false;
  try{
    await navigator.clipboard.writeText(ta.value);
    done = true;
  }catch(e){
    try{
      ta.focus(); ta.select();
      done = document.execCommand('copy');
    }catch(e2){ done = false; }
  }
  if(done){ toast('Copiado!'); if(btn){ const old=btn.textContent; btn.textContent='Copiado ✓'; setTimeout(()=>btn.textContent=old, 1400); } }
  else { ta.focus(); ta.select(); toast('Selecionado — use Ctrl+C (ou ⌘+C) para copiar.', true); }
}

function bindContentEvents(){
  const c = document.getElementById('content');

  c.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', e=>{
    const [kind,id] = el.dataset.open.split(':'); openModal(kind, id);
  }));
  c.querySelectorAll('[data-add]').forEach(el=>el.addEventListener('click', e=>{
    const [kind,dateKey,periodo] = el.dataset.add.split(':'); openModal(kind, null, {data:dateKey, periodo});
  }));

  // Finalizados
  c.querySelectorAll('[data-final-tab]').forEach(el=>el.addEventListener('click', ()=>{ S.finalFilter = el.dataset.finalTab; render(); }));
  const fs = document.getElementById('finalSearch');
  if(fs) fs.addEventListener('input', e=>{ S.finalSearch = e.target.value; render(); document.getElementById('finalSearch').focus(); document.getElementById('finalSearch').selectionStart = document.getElementById('finalSearch').value.length; });
  c.querySelectorAll('[data-reopen]').forEach(el=>el.addEventListener('click', ()=>{ const [k,id]=el.dataset.reopen.split(':'); reopen(k,id); }));
  c.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click', async ()=>{ const [k,id]=el.dataset.del.split(':'); const ok = await confirmDialog('Excluir este registro definitivamente?', {okLabel:'Excluir'}); if(ok) deleteItem(k,id); }));

  // Config
  c.querySelectorAll('[data-cfg-tab]').forEach(el=>el.addEventListener('click', ()=>{ S.configTab = el.dataset.cfgTab; render(); }));
  const addItemBtn = document.getElementById('cfgAddItem');
  if(addItemBtn) addItemBtn.addEventListener('click', ()=>{
    const inp = document.getElementById('cfgNewItem'); const v = inp.value.trim(); if(!v) return;
    const arr = (S.config[S.configTab]||[]).concat(v);
    saveConfig({[S.configTab]:arr}); inp.value='';
  });
  const newItemInput = document.getElementById('cfgNewItem');
  if(newItemInput) newItemInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addItemBtn.click(); });
  c.querySelectorAll('[data-rm-item]').forEach(el=>el.addEventListener('click', ()=>{
    const [tab,idx] = el.dataset.rmItem.split(':'); const arr=(S.config[tab]||[]).slice(); arr.splice(+idx,1); saveConfig({[tab]:arr});
  }));
  const addFieldBtn = document.getElementById('cfgAddField');
  if(addFieldBtn) addFieldBtn.addEventListener('click', ()=>{
    const inp = document.getElementById('cfgNewField'); const v = inp.value.trim(); if(!v) return;
    const arr = (S.config[S.configTab]||[]).concat({id:uid(), label:v, type:'texto'});
    saveConfig({[S.configTab]:arr}); inp.value='';
  });
  const newFieldInput = document.getElementById('cfgNewField');
  if(newFieldInput) newFieldInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addFieldBtn.click(); });
  c.querySelectorAll('[data-rm-field]').forEach(el=>el.addEventListener('click', ()=>{
    const [tab,idx] = el.dataset.rmField.split(':'); const arr=(S.config[tab]||[]).slice(); arr.splice(+idx,1); saveConfig({[tab]:arr});
  }));
  const saveJanelasBtn = document.getElementById('saveJanelas');
  if(saveJanelasBtn) saveJanelasBtn.addEventListener('click', ()=>{
    const janelas = {
      manha:{ inicio: document.getElementById('jManhaIni').value||'', fim: document.getElementById('jManhaFim').value||'' },
      tarde:{ inicio: document.getElementById('jTardeIni').value||'', fim: document.getElementById('jTardeFim').value||'' },
    };
    saveConfig({janelas});
    toast('Janelas de horário salvas.');
  });
  const exportBtn = document.getElementById('exportCsv');
  if(exportBtn) exportBtn.addEventListener('click', exportCsv);
  const dashBackupBtn = document.getElementById('dashBackupBtn');
  if(dashBackupBtn) dashBackupBtn.addEventListener('click', exportCsv);
  const wipeBtn = document.getElementById('wipeData');
  if(wipeBtn) wipeBtn.addEventListener('click', async ()=>{
    const ok = await confirmDialog('Isso apaga TODAS as entregas e coletas cadastradas. Essa ação não pode ser desfeita.', {okLabel:'Apagar tudo'});
    if(!ok) return;
    if(S.dbReady){
      const all = allEntregas().concat(allColetas());
      for(const it of allEntregas()) await S.db.collection('entregas').doc(it.id).delete();
      for(const it of allColetas()) await S.db.collection('coletas').doc(it.id).delete();
    } else { S.entregas={}; S.coletas={}; saveFallback(); render(); }
    toast('Registros apagados.');
  });

  // dashboard mini rows reuse data-open, already bound above
}

/* ---------------- MODAL ---------------- */
function openModal(kind, id, seed){
  S.modal = {kind, id: id||null, seed: seed||{}};
  renderModal();
}
function closeModal(){ S.modal=null; const ov=document.getElementById('modalOverlay'); if(ov) ov.remove(); }

          </div>`).join('')}

        <div class="field">
          <label>Observações</label>
          <textarea id="fObs" placeholder="Notas internas, itens faltantes, contato do motorista…">${esc(item.obs||'')}</textarea>
        </div>
      </div>
      <div class="modal-foot">
        <div style="display:flex; gap:8px;">
          ${id?`<button class="btn btn-ghost btn-danger" id="mDelete">${ICN.trash}Excluir</button>`:''}
          <button class="btn btn-ghost" id="mTrello" title="Gerar título e descrição prontos para colar no Trello">📋 Copiar p/ Trello</button>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" id="mCancel">Cancelar</button>
          <button class="btn btn-primary" id="mSave">${ICN.check}Salvar</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  let curStatus = item.status, curPeriodo = item.periodo;

  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('mTrello').addEventListener('click', ()=>{
    const curForn = document.getElementById('fForn').value.trim() || '(sem fornecedor)';
    const curData = document.getElementById('fData').value || item.data;
    const win = (document.getElementById('fJanelaIni').value || document.getElementById('fJanelaFim').value)
      ? `${fmtHM(document.getElementById('fJanelaIni').value)}–${fmtHM(document.getElementById('fJanelaFim').value)}`
      : defaultWindowLabel(curPeriodo);
    const periodoTxt = PERIODO_LABEL[curPeriodo] + (win?` (${win})`:'');
    const statusTxt = STATUS_LABEL[curStatus] || curStatus;
    const obsTxt = document.getElementById('fObs').value.trim();

    let title, descLines;
    if(isEntrega){
      const obraV = document.getElementById('fObra').value.trim();
      const poV = document.getElementById('fPO').value.trim();
      title = [curForn, obraV, poV].filter(Boolean).join(' - ');
      descLines = [
        `Fornecedor: ${curForn}`,
        obraV ? `Obra: ${obraV}` : null,
        poV ? `N° do Pedido: ${poV}` : null,
        `Data prevista: ${fmtDateBR(curData)} — ${periodoTxt}`,
        `Status: ${statusTxt}`,
        obsTxt ? `Observações: ${obsTxt}` : null,
        document.getElementById('fAnexo').value.trim() ? document.getElementById('fAnexo').value.trim() : null,
      ];
    } else {
      const endV = document.getElementById('fEndereco').value.trim();
      const pesoV = document.getElementById('fPeso').value.trim();
      const qtdV = document.getElementById('fQtd').value.trim();
      title = [curForn, endV].filter(Boolean).join(' - ');
      descLines = [
        `Fornecedor: ${curForn}`,
        endV ? `Endereço de retirada: ${endV}` : null,
        (pesoV||qtdV) ? `Peso: ${pesoV||'—'} kg | Quantidade: ${qtdV||'—'}` : null,
        `Data prevista: ${fmtDateBR(curData)} — ${periodoTxt}`,
        `Status: ${statusTxt}`,
        obsTxt ? `Observações: ${obsTxt}` : null,
      ];
    }
    openTrelloModal(title, descLines.filter(Boolean).join('\n'));
  });

  overlay.querySelectorAll('[data-periodo]').forEach(el=>el.addEventListener('click', ()=>{
    curPeriodo = el.dataset.periodo;
    overlay.querySelectorAll('[data-periodo]').forEach(x=>x.classList.toggle('active', x.dataset.periodo===curPeriodo));
  }));
  overlay.querySelectorAll('[data-status]').forEach(el=>el.addEventListener('click', ()=>{
    curStatus = el.dataset.status;
    overlay.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active', x.dataset.status===curStatus));
  }));

  function wireAutocomplete(inputId, listId, options){
    const input = document.getElementById(inputId); const list = document.getElementById(listId);
    if(!input) return;
    function show(){
      const q = input.value.trim().toLowerCase();
      const matches = options.filter(o=>o.toLowerCase().includes(q)).slice(0,6);
      if(!matches.length){ list.style.display='none'; return; }
      list.innerHTML = matches.map(m=>`<div>${esc(m)}</div>`).join('');
      list.style.display='block';
      list.querySelectorAll('div').forEach((d,i)=>d.addEventListener('mousedown', ()=>{ input.value=matches[i]; list.style.display='none'; }));
    }
    input.addEventListener('focus', show);
    input.addEventListener('input', show);
    input.addEventListener('blur', ()=>setTimeout(()=>list.style.display='none', 120));
  }
  wireAutocomplete('fForn','acForn', sugForn);
  if(isEntrega) wireAutocomplete('fObra','acObra', sugObra);

  /* --- anexos (file uploads via assets capability) --- */
  let anexos = (isEntrega && item.anexos) ? item.anexos.slice() : [];
  let assetsNS = null;
  if(isEntrega){
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const dzBrowse = document.getElementById('dzBrowse');
    const anexoListEl = document.getElementById('anexoList');

    function fmtBytes(n){
      if(n==null) return '';
      if(n<1024) return n+' B';
      if(n<1024*1024) return (n/1024).toFixed(0)+' KB';
      return (n/1024/1024).toFixed(1)+' MB';
    }
    function renderAnexoList(){
      if(!anexoListEl) return;
      anexoListEl.innerHTML = anexos.map(a=>`
        <div class="anexo-chip" data-anexo-id="${esc(a.id)}">
          ${ICN.link}<a href="/_blob/${esc(a.id)}" target="_blank" rel="noopener">${esc(a.name||'arquivo')}</a>
          <span class="anexo-size">${fmtBytes(a.sizeBytes)}</span>
          <button type="button" data-rm-anexo="${esc(a.id)}" title="Remover">${ICN.x}</button>
        </div>`).join('');
      anexoListEl.querySelectorAll('[data-rm-anexo]').forEach(btn=>btn.addEventListener('click', async ()=>{
        const aid = btn.dataset.rmAnexo;
        const ok = await confirmDialog('Remover este anexo? Essa ação não pode ser desfeita.', {okLabel:'Remover'});
        if(!ok) return;
        if(assetsNS){ try{ await assetsNS.delete(aid); }catch(e){} }
        anexos = anexos.filter(a=>a.id!==aid);
        renderAnexoList();
        if(id) await saveEntrega({anexos}, id);
      }));
    }
    renderAnexoList();

    async function handleFiles(fileList){
      if(!assetsNS){ toast('Envio de arquivos indisponível nesta visualização (é preciso abrir pelo link publicado, com permissão de edição).', true); return; }
      for(const file of Array.from(fileList)){
        const tempId = 'up_'+Math.random().toString(36).slice(2);
        anexos.push({id:tempId, name:file.name, sizeBytes:file.size, uploading:true});
        renderAnexoList();
        try{
          const res = await assetsNS.upload(file);
          anexos = anexos.map(a=>a.id===tempId ? {id:res.id, name:file.name, sizeBytes:res.sizeBytes, contentType:res.contentType} : a);
          renderAnexoList();
          if(id) await saveEntrega({anexos}, id);
        }catch(e){
          anexos = anexos.filter(a=>a.id!==tempId);
          renderAnexoList();
          const code = e && e.code;
          const msg = code==='too_large' ? 'Arquivo muito grande.' : code==='unsupported_type' ? 'Tipo de arquivo não aceito (use PDF, PNG, JPG, WEBP ou GIF).' : 'Não foi possível enviar o arquivo.';
          toast(msg, true);
        }
      }
    }

    if(dropZone){
      dzBrowse.addEventListener('click', ()=>fileInput.click());
      dropZone.addEventListener('click', e=>{ if(e.target===dzBrowse) return; fileInput.click(); });
      fileInput.addEventListener('change', e=>{ if(e.target.files.length) handleFiles(e.target.files); fileInput.value=''; });
      ['dragenter','dragover'].forEach(evt=>dropZone.addEventListener(evt, e=>{ e.preventDefault(); dropZone.classList.add('drag-over'); }));
      ['dragleave','drop'].forEach(evt=>dropZone.addEventListener(evt, e=>{ e.preventDefault(); dropZone.classList.remove('drag-over'); }));
      dropZone.addEventListener('drop', e=>{ if(e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
    }

    (async ()=>{
      try{ assetsNS = S.dbReady ? await window.claude.use('assets') : null; }
      catch(e){ assetsNS = null; }
      if(!assetsNS && dropZone){
        dropZone.innerHTML = `<div class="dz-inner" style="color:var(--text-faint)">Envio de arquivos disponível apenas com permissão de edição, abrindo pelo link publicado.</div>`;
      }
    })();
  }

  if(id){
    document.getElementById('mDelete').addEventListener('click', async ()=>{
      const ok = await confirmDialog('Excluir este registro definitivamente?', {okLabel:'Excluir'});
      if(ok){ await deleteItem(kind, id); closeModal(); }
    });
  }

  document.getElementById('mSave').addEventListener('click', async ()=>{
    const forn = document.getElementById('fForn').value.trim();
    if(!forn){ toast('Informe o fornecedor.', true); return; }
    const dataVal = document.getElementById('fData').value || todayKey();
    const extrasOut = {};
    extraFields.forEach(f=>{ const el = overlay.querySelector(`[data-extra="${f.id}"]`); if(el) extrasOut[f.id]=el.value; });

    let payload;
    const justFinalized = curStatus==='entregue' && item.status!=='entregue';
    const janelaIni = document.getElementById('fJanelaIni').value || null;
    const janelaFim = document.getElementById('fJanelaFim').value || null;
    if(isEntrega){
      payload = {
        fornecedor: forn,
        pedidoCompra: document.getElementById('fPO').value.trim(),
        anexoLink: document.getElementById('fAnexo').value.trim(),
        anexos: anexos.filter(a=>!a.uploading),
        obra: document.getElementById('fObra').value.trim(),
        data: dataVal, periodo: curPeriodo, status: curStatus,
        janelaInicio: janelaIni, janelaFim: janelaFim,
        obs: document.getElementById('fObs').value,
        extras: extrasOut,
      };
      if(curStatus==='entregue' && item.status!=='entregue') { payload.finalizadoEm = Date.now(); payload.statusAnterior = item.status; }
      if(curStatus!=='entregue') payload.finalizadoEm = null;
    } else {
      payload = {
        fornecedor: forn,
        peso: document.getElementById('fPeso').value.trim(),
        quantidade: document.getElementById('fQtd').value.trim(),
        endereco: document.getElementById('fEndereco').value.trim(),
        data: dataVal, periodo: curPeriodo, status: curStatus,
        janelaInicio: janelaIni, janelaFim: janelaFim,
        obs: document.getElementById('fObs').value,
        extras: extrasOut,
      };
      if(curStatus==='entregue' && item.status!=='entregue') { payload.finalizadoEm = Date.now(); payload.statusAnterior = item.status; }
      if(curStatus!=='entregue') payload.finalizadoEm = null;
    }

    // auto-learn new fornecedor/obra into suggestion lists
    const cfgPatch = {};
    if(forn && !sugForn.includes(forn)) cfgPatch.fornecedores = sugForn.concat(forn);
    if(isEntrega){
      const obraVal = payload.obra;
      if(obraVal && !sugObra.includes(obraVal)) cfgPatch.obras = sugObra.concat(obraVal);
    }
    if(Object.keys(cfgPatch).length) saveConfig(cfgPatch);

    const ok = isEntrega ? await saveEntrega(payload, id) : await saveColeta(payload, id);
    if(ok){
      closeModal();
      if(justFinalized){ fireworksBurst(); }
      else { toast(id?'Alterações salvas.':(isEntrega?'Entrega cadastrada.':'Coleta cadastrada.')); }
    }
  });
}

/* ---------------- CSV EXPORT (backup) ---------------- */
async function exportCsv(){
  const lines = [];
  lines.push('Tipo;Fornecedor;Pedido de Compra;Obra;Endereco;Peso;Quantidade;Data;Periodo;Status;Observacoes');
  allEntregas().forEach(i=>{
    lines.push(['Entrega', i.fornecedor, i.pedidoCompra, i.obra, '', '', '', fmtDateBR(i.data), i.periodo, STATUS_LABEL[effectiveStatus(i)], (i.obs||'').replace(/[\n;]/g,' ')].map(csvEsc).join(';'));
  });
  allColetas().forEach(i=>{
    lines.push(['Coleta', i.fornecedor, '', '', i.endereco, i.peso, i.quantidade, fmtDateBR(i.data), i.periodo, STATUS_LABEL[effectiveStatus(i)], (i.obs||'').replace(/[\n;]/g,' ')].map(csvEsc).join(';'));
  });
  const csv = '\uFEFF'+lines.join('\r\n');
  const filename = 'ana-esquadrias-backup-'+todayKey()+'.csv';
  let saved = false;

  if(S.dbReady){
    try{
      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename, data:csv}); toast('Backup baixado.'); saved = true; }
    }catch(e){}
  }
  if(!saved){
    try{
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast('Backup baixado.');
      saved = true;
    }catch(e){ toast('Não foi possível gerar o backup.', true); }
  }
  if(saved) saveConfig({lastBackupAt: Date.now()});
}
function csvEsc(v){ v=String(v==null?'':v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }

/* ---------------- PRINT ---------------- */
function buildPrintDoc(route){
  const kind = route==='coletas' ? 'coleta' : 'entrega';
  const days = weekDays(S.weekAnchor);
  const items = kind==='entrega' ? activeEntregas() : activeColetas();

  let daysHtml = days.map(d=>{
    const key = toKey(d);
    const dayItems = items.filter(i=>i.data===key);
    const manha = dayItems.filter(i=>i.periodo==='manha');
    const tarde = dayItems.filter(i=>i.periodo==='tarde');
    function table(rows){
      if(!rows.length) return `<div class="p-empty">Sem ${kind==='entrega'?'entregas':'coletas'} previstas.</div>`;
      if(kind==='entrega'){
        return `<table class="p-table"><thead><tr><th>Horário</th><th>Fornecedor</th><th>Pedido de compra</th><th>Obra</th></tr></thead><tbody>
          ${rows.map(r=>`<tr><td>${esc(effectiveWindowLabel(r)||'—')}</td><td>${esc(r.fornecedor)}</td><td>${esc(r.pedidoCompra||'—')}</td><td>${esc(r.obra||'—')}</td></tr>`).join('')}
        </tbody></table>`;
      }
      return `<table class="p-table"><thead><tr><th>Horário</th><th>Fornecedor</th><th>Peso</th><th>Qtd.</th><th>Endereço</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(effectiveWindowLabel(r)||'—')}</td><td>${esc(r.fornecedor)}</td><td>${esc(r.peso||'—')} kg</td><td>${esc(r.quantidade||'—')}</td><td>${esc(r.endereco||'—')}</td></tr>`).join('')}
      </tbody></table>`;
    }
    return `<div class="p-day">
      <h2>${DOW[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}</h2>
      <div class="p-period">Manhã${defaultWindowLabel('manha')?` (${defaultWindowLabel('manha')})`:''}</div>${table(manha)}
      <div class="p-period">Tarde${defaultWindowLabel('tarde')?` (${defaultWindowLabel('tarde')})`:''}</div>${table(tarde)}
    </div>`;
  }).join('');

  const bodyHtml = `
    <div class="p-header">
      <h1>Roteiro semanal de ${kind==='entrega'?'entregas':'coletas'} — Ana Esquadrias</h1>
      <div class="p-sub">${weekLabel(S.weekAnchor)}</div>
    </div>
    ${daysHtml}
    <div class="p-foot">Gerado em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
  `;

  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<title>Roteiro — Ana Esquadrias</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif; color:#0a2a3b; margin:24px; background:#fff;}
  .p-header{display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #002f43; padding-bottom:10px; margin-bottom:16px;}
  .p-header h1{font-size:18px; color:#002f43; margin:0;}
  .p-header .p-sub{font-size:11px; color:#555;}
  .p-day{margin-bottom:14px; break-inside:avoid;}
  .p-day h2{font-size:13px; background:#002f43; color:#fff; padding:5px 10px; border-radius:4px; margin:0 0 6px;}
  .p-period{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#666; margin:6px 0 3px; font-weight:700;}
  table.p-table{width:100%; border-collapse:collapse; margin-bottom:4px;}
  table.p-table th{text-align:left; font-size:10px; text-transform:uppercase; color:#555; border-bottom:1px solid #999; padding:4px 6px;}
  table.p-table td{font-size:11.5px; padding:5px 6px; border-bottom:1px solid #ddd;}
  .p-empty{font-size:11px; color:#888; padding:4px 6px; font-style:italic;}
  .p-foot{margin-top:16px; font-size:9.5px; color:#888; text-align:right;}
  .p-printbar{margin-bottom:18px;}
  .p-printbar button{font-family:inherit; font-size:13px; font-weight:700; padding:9px 16px; border-radius:8px; border:1px solid #002f43; background:#002f43; color:#fff; cursor:pointer;}
  @media print{ .p-printbar{display:none;} body{margin:0;} }
</style></head>
<body>
<div class="p-printbar"><button id="printBtn">🖨️ Imprimir esta página</button></div>
${bodyHtml}
<script>
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
<\/script>
</body></html>`;
}

async function doPrint(route){
  const html = buildPrintDoc(route);

  // 1) try opening a real new tab the user can print from (most reliable across embeds)
  let opened = null;
  try{ opened = window.open('', '_blank'); }catch(e){ opened = null; }
  if(opened){
    try{
      opened.document.open();
      opened.document.write(html);
      opened.document.close();
      opened.focus();
      setTimeout(()=>{ try{ opened.print(); }catch(e){} }, 250);
      toast('Roteiro aberto em nova aba. Use o botão de impressão ali, ou Ctrl+P.');
      return;
    }catch(e){ /* fall through to download */ }
  }

  // 2) fallback: offer the printable page as a downloadable HTML file
  const filename = 'roteiro-'+(route==='coletas'?'coletas':'entregas')+'-'+todayKey()+'.html';
  try{
    const dl = S.dbReady ? await window.claude.use('downloads') : null;
    if(dl){
      await dl.save({filename, data:html});
      toast('Não foi possível abrir uma nova aba — baixamos o roteiro para você abrir e imprimir.', true);
      return;
    }
  }catch(e){ /* continue to blob fallback */ }

  try{
    const blob = new Blob([html], {type:'text/html;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Roteiro baixado — abra o arquivo e imprima com Ctrl+P.', true);
  }catch(e){
    toast('Não foi possível gerar o roteiro para impressão.', true);
  }
}
